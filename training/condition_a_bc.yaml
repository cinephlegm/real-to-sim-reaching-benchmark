# Condition A: Behavioural Cloning only
# Pure imitation from 60 human demonstrations.
# Extrinsic reward disabled — agent learns solely from demo actions.
# Run from repo root:
#   conda activate unity-ml
#   mlagents-learn training/condition_a_bc.yaml --run-id=condition_a --force

behaviors:
  PickPlace:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true        # essential: obs span angles, distances, velocities at different scales
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.0         # Condition A: BC only, no extrinsic reward
    behavioral_cloning:
      demo_path: ./data/demos
      steps: 2000000          # BC active across full run
      strength: 1.0
    max_steps: 2000000
    time_horizon: 256
    summary_freq: 1000
    keep_checkpoints: 40
    checkpoint_interval: 50000
