# Condition B: BC-initialised PPO
# Behavioural Cloning provides a shaped prior; PPO + extrinsic reward refines it.
# Run from repo root:
#   conda activate unity-ml
#   mlagents-learn training/condition_b_bc_ppo.yaml --run-id=condition_b --force

behaviors:
  PickPlace:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024      # identical to Condition A
      buffer_size: 10240    # identical to Condition A
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true       # identical to Condition A
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0       # Condition B: PPO reward signal active
    behavioral_cloning:
      demo_path: ./data/demos
      steps: 500000         # BC prior seeds policy for first 500k steps
      strength: 1.0         # identical strength to Condition A during BC phase
    max_steps: 10000000
    time_horizon: 256       # identical to Condition A
    summary_freq: 1000
    keep_checkpoints: 40
    checkpoint_interval: 50000
